<div class="app">
    <aside class="sidebar">
        <!-- Zone fichiers (haut, redimensionnable) -->
        <div class="sidebar-files" id="sidebarFiles">
            <!-- Connecté : fichier conservé dans l'espace personnel -->
            <button class="upload-btn" id="uploadBtnAuth" title="Charger votre fichier (MF4, CSV, MAT, DAT, BLF)" data-auth="required">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span class="upload-btn-title">Charger un fichier</span>
            </button>
            <!-- Non connecté : fichier temporaire, non sauvegardé -->
            <button class="upload-btn" id="uploadBtnGuest" title="Charger un fichier temporaire, non sauvegardé" data-auth="guest">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span class="upload-btn-title">Charger un fichier</span>
            </button>

            <div class="sidebar-section-title run-slots-title">Exemples et fichiers récents</div>

            <!-- Mono-fichier: selecteur de source actif (demo + uploads). En mode comparaison
                 (opt-in via le bouton Comparer), ce slot se masque au profit du roster ci-dessous. -->
            <div class="run-slots" id="runSlots">
                <div class="run-slot">
                    <span class="run-swatch"></span>
                    <select id="sourceSelector" class="run-slot-select">
                        <option value="">Chargement...</option>
                    </select>
                    <button class="run-details-btn" type="button" title="Details du fichier" aria-label="Details du fichier">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Roster des runs en comparaison (rendu par run-list.js) -->
            <div class="run-roster" id="runRoster"></div>
            <!-- Entree / sortie du mode comparaison (opt-in), visible des deux fichiers uploades -->
            <button class="run-compare-btn" id="runCompareBtn" type="button" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/>
                </svg>
                <span>Comparer les fichiers</span>
            </button>
        </div>

        <!-- Splitter vertical entre zone fichiers et zone signaux -->
        <div class="sidebar-vsplitter" id="sidebarVSplitter" title="Redimensionner"></div>

        <!-- Zone signaux (bas) -->
        <div class="sidebar-signals" id="sidebarSignals">
            <div class="sidebar-section-header">
                <span class="sidebar-section-title">Signaux</span>
            </div>
            <input type="search" class="search-box" id="search" name="signal-filter" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
            <div class="signal-list" id="signalList">
                <div class="signal-list-empty">Chargement...</div>
            </div>
            <button class="create-variable-btn" id="createVariableBtn" title="Créer une variable calculée">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Créer une variable</span>
            </button>
        </div>

        <div class="sidebar-footer">
            <span class="stat"><span class="stat-label">Signaux:</span> <span id="statSignals">-</span></span>
            <span class="stat"><span class="stat-label">Longueur:</span> <span id="statDuration">-</span></span>
            <span class="stat"><span class="stat-label">Serveur:</span> <span id="statServer">-</span></span>
        </div>
    </aside>

    <main class="main">
        <div class="toolbar">
            <button class="toolbar-btn" id="addCursorBtn" title="Ajouter un curseur (Ctrl + clic gauche)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="9" y1="4" x2="9" y2="20"/>
                    <line x1="6" y1="4" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="12" y2="20"/>
                    <line x1="17" y1="9" x2="17" y2="15"/>
                    <line x1="14" y1="12" x2="20" y2="12"/>
                </svg>
            </button>

            <button class="toolbar-btn active" id="cursorLabelsToggle" aria-pressed="true" title="Afficher les infos des curseurs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                    <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
            </button>

            <span class="toolbar-divider" aria-hidden="true"></span>

            <button class="toolbar-btn active" id="syncViewsToggle" aria-pressed="true" title="Synchroniser zoom et pan entre les onglets">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    <line class="icon-off-slash" x1="2" y1="2" x2="22" y2="22"/>
                </svg>
            </button>

            <button class="toolbar-btn" id="syncCursorsToggle" aria-pressed="false" title="Synchroniser les curseurs entre les onglets">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="6" y1="4" x2="6" y2="20"/>
                    <line x1="3" y1="4" x2="9" y2="4"/>
                    <line x1="3" y1="20" x2="9" y2="20"/>
                    <line x1="21" y1="9" x2="12" y2="9"/>
                    <polyline points="15 6 12 9 15 12"/>
                    <line x1="12" y1="15" x2="21" y2="15"/>
                    <polyline points="18 12 21 15 18 18"/>
                </svg>
            </button>

            <button class="toolbar-btn active" id="zoneTooltipToggle" aria-pressed="true" title="Stats au survol des zones booleennes (min/moy/max)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    <line x1="8" y1="9" x2="8" y2="12"/>
                    <line x1="12" y1="7" x2="12" y2="12"/>
                    <line x1="16" y1="10" x2="16" y2="12"/>
                </svg>
            </button>

            <button id="resetBtn">Réinitialiser le zoom</button>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button id="clearBtn">Effacer tout</button>

            <!-- Actions de layout (session/workspace, pas par-onglet): regroupees ici avec
                 les autres controles globaux plutot que sur la rangee des tabs, pour ne pas
                 scinder un meme niveau de controle entre deux rangees. Le divider avant ce
                 groupe pousse le reste a droite (voir .toolbar-divider:has(+ .toolbar-actions)). -->
            <span class="toolbar-divider" aria-hidden="true"></span>
            <div class="toolbar-actions">
                <button class="toolbar-btn" id="saveLayoutBtn" title="Enregistrer le layout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                </button>
                <button class="toolbar-btn" id="loadLayoutBtn" title="Charger un layout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>
                <button class="toolbar-btn" id="shareViewBtn" title="Copier le lien de cette vue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                </button>
                <button class="toolbar-btn" id="exportPngBtn" title="Capturer et annoter la vue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="plots-area" id="plotsArea">
            <div class="tabs-container">
                <div class="tabs-list" id="tabsList"></div>
                <button class="tab-add" id="tabAddBtn" title="Nouvel onglet">+</button>
            </div>
            <!-- Tab contents will be created dynamically by JavaScript -->
        </div>
    </main>
</div>
