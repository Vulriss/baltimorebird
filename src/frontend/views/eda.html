<div class="app">
    <!-- Onglets fichiers: un onglet par fichier ouvert, l'onglet actif est le fichier
         courant (rendu par run-list.js). En comparaison, les onglets deviennent le
         roster des runs compares. -->
    <div class="file-bar" id="fileBar">
        <div class="file-tabs" id="fileTabs" role="tablist" aria-label="Fichiers ouverts"></div>
        <div class="file-add">
            <button class="file-add-btn" id="fileAddBtn" type="button" aria-haspopup="menu" aria-expanded="false"
                    title="Ajouter un fichier (MF4, CSV, MAT, DAT, BLF)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span>Ajouter un fichier</span>
            </button>
        </div>
        <div class="file-bar-compare" id="fileBarCompare"></div>
        <!-- Pont de selection de source: reste la source de verite lue par sessions.js,
             runs.js, export-annotate.js et l'onboarding. Les onglets et le menu d'ajout
             le pilotent, il n'est jamais affiche. -->
        <select id="sourceSelector" class="visually-hidden" tabindex="-1" aria-hidden="true">
            <option value="">Chargement...</option>
        </select>
    </div>

    <div class="app-body">
    <aside class="sidebar">
        <!-- Fiche du fichier actif (file-info.js), sous l'onglet fichier. Sa hauteur suit
             celle de la toolbar pour aligner la zone signaux sur la rangee des onglets de
             layout: une ligne toolbar repliee, la fiche complete toolbar depliee. -->
        <div class="sidebar-info" id="sidebarInfo">
            <section class="active-file" aria-label="Fichier actif">
                <div class="active-file-head">
                    <span class="active-file-format" id="fileInfoFormat" hidden></span>
                    <span class="active-file-name" id="fileInfoName"></span>
                </div>
                <div class="active-file-stats">
                    <span id="statSignals">-</span>
                    <span class="active-file-duration" id="fileInfoDuration" hidden>
                        <span class="active-file-sep" aria-hidden="true">·</span>
                        <span id="statDuration"></span>
                    </span>
                </div>
                <div class="active-file-status" id="fileInfoStatus" hidden>
                    <span>Temporaire, non enregistré</span>
                    <button type="button" class="active-file-login" id="fileInfoLogin"
                            title="Les fichiers chargés une fois connecté sont enregistrés">Se connecter</button>
                </div>
            </section>
            <span class="sidebar-info-divider" aria-hidden="true"></span>
        </div>

        <!-- Zone signaux -->
        <div class="sidebar-signals" id="sidebarSignals">
            <div class="sidebar-section-header">
                <span class="sidebar-section-title">Signaux</span>
            </div>
            <input type="search" class="search-box" id="search" name="signal-filter" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
            <div class="signal-list" id="signalList">
                <div class="signal-list-empty">Chargement...</div>
            </div>
            <button class="create-variable-btn" id="createVariableBtn" title="Créer une variable calculée">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Créer une variable</span>
            </button>
        </div>
    </aside>

    <main class="main">
        <!-- Toolbar en groupes. Repliee: icones seules; depliee: titres de groupe et
             libelles sous chaque bouton (etat persiste par toolbar.js). -->
        <div class="toolbar" id="edaToolbar">
            <div class="toolbar-section">
                <span class="toolbar-section-title">Analyse</span>
                <div class="toolbar-section-btns">
                    <button class="toolbar-btn active" id="cursorLabelsToggle" aria-pressed="true" title="Afficher les infos des curseurs">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                                <line x1="7" y1="7" x2="7.01" y2="7"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Infos curseurs</span>
                    </button>
                    <button class="toolbar-btn active" id="zoneTooltipToggle" aria-pressed="true" title="Stats au survol des zones booleennes (min/moy/max)">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                <line x1="8" y1="9" x2="8" y2="12"/>
                                <line x1="12" y1="7" x2="12" y2="12"/>
                                <line x1="16" y1="10" x2="16" y2="12"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Stats au survol</span>
                    </button>
                </div>
            </div>

            <span class="toolbar-divider" aria-hidden="true"></span>

            <div class="toolbar-section">
                <span class="toolbar-section-title">Synchronisation</span>
                <div class="toolbar-section-btns">
                    <button class="toolbar-btn" id="syncCursorsToggle" aria-pressed="false" title="Synchroniser les curseurs entre les onglets">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="6" y1="4" x2="6" y2="20"/>
                                <line x1="3" y1="4" x2="9" y2="4"/>
                                <line x1="3" y1="20" x2="9" y2="20"/>
                                <line x1="21" y1="9" x2="12" y2="9"/>
                                <polyline points="15 6 12 9 15 12"/>
                                <line x1="12" y1="15" x2="21" y2="15"/>
                                <polyline points="18 12 21 15 18 18"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Sync curseurs</span>
                    </button>
                    <button class="toolbar-btn active" id="syncViewsToggle" aria-pressed="true" title="Synchroniser zoom et pan entre les onglets">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                <line class="icon-off-slash" x1="2" y1="2" x2="22" y2="22"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Sync zoom/pan</span>
                    </button>
                </div>
            </div>

            <span class="toolbar-divider" aria-hidden="true"></span>

            <div class="toolbar-section">
                <span class="toolbar-section-title">Vue</span>
                <div class="toolbar-section-btns">
                    <button class="toolbar-btn toolbar-btn--danger" id="clearBtn" title="Effacer tous les graphiques">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"/>
                                <polyline points="1 20 1 14 7 14"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Effacer tout</span>
                    </button>
                </div>
            </div>

            <button class="toolbar-collapse" id="toolbarCollapseBtn" type="button" aria-expanded="false" title="Afficher les libellés">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
        </div>

        <div class="plots-area" id="plotsArea">
            <div class="tabs-container">
                <div class="tabs-list" id="tabsList"></div>
                <button class="tab-add" id="tabAddBtn" title="Nouvel onglet">+</button>
                <!-- Actions sur ce qui est affiche: sortir la vue (capture, lien), puis le
                     layout lui-meme (exporter, importer). Elles portent sur les onglets de
                     layout, d'ou leur place au bout de la rangee qui les affiche. -->
                <div class="tabs-actions">
                    <button class="toolbar-btn toolbar-btn--inline" id="exportPngBtn" type="button" title="Capturer et annoter la vue">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Capture</span>
                    </button>
                    <button class="toolbar-btn toolbar-btn--inline" id="shareViewBtn" type="button" title="Copier le lien de cette vue">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="18" cy="5" r="3"/>
                                <circle cx="6" cy="12" r="3"/>
                                <circle cx="18" cy="19" r="3"/>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Partager</span>
                    </button>
                    <span class="tabs-actions-divider" aria-hidden="true"></span>
                    <button class="toolbar-btn toolbar-btn--inline" id="saveLayoutBtn" type="button" title="Exporter le layout">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Exporter</span>
                    </button>
                    <button class="toolbar-btn toolbar-btn--inline" id="loadLayoutBtn" type="button" title="Importer un layout">
                        <span class="toolbar-btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                        </span>
                        <span class="toolbar-btn-label">Importer</span>
                    </button>
                </div>
            </div>
            <!-- Tab contents will be created dynamically by JavaScript -->
        </div>

        <div class="content-footer">
            <span class="text"><span class="text-label">server latency:</span> <span id="statServer">-</span></span>
            <span class="text"><span class="text-label"><span id="app-footer-info">-</span></span></span>
            <span class="text"><span class="text-label">Crafted with ❤️ by the <b>MINT Team</b></span></span>
        </div>
    </main>
    </div>
</div>
